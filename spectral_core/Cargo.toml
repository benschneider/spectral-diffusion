[package]
name = "spectral-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "spectral_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.20", features = ["extension-module"] }
numpy = "0.20"
dlpack = "0.2"
thiserror = "1.0"
anyhow = "1.0"
rustfft = { version = "6.1", features = ["avx", "sse", "neon"] }
rayon = "1.8"
once_cell = "1.19"

[features]
default = []
fftw = ["dep:fftw-sys", "dep:fftw"]
mkl = ["dep:intel-mkl-sys"]
cuda = ["dep:cust"]

[dependencies.fftw-sys]
version = "0.8.0"
optional = true
features = ["system"]

[dependencies.fftw]
version = "0.8.0"
optional = true

[dependencies.intel-mkl-sys]
version = "0.8.1"
optional = true

[dependencies.cust]
version = "0.3"
optional = true