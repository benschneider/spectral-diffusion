[package]
name = "spectral-core"
version = "0.2.0"
edition = "2021"

[lib]
name = "spectral_core"
crate-type = ["cdylib"]

[dependencies]
once_cell = "1.19"
num_cpus = "1.16"
pyo3 = { version = "0.20", features = ["extension-module"] }

[features]
default = ["fftw"]
fftw = ["dep:fftw-sys"]
mkl = []
cuda = []

[dependencies.fftw-sys]
version = "0.8.0"
optional = true
features = ["system"]
