[package]
name = "spectral-core"
version = "0.3.0"
edition = "2021"

[lib]
name = "spectral_core"
crate-type = ["cdylib"]

[dependencies]
once_cell = "1.19"
num_cpus = "1.16"
ndarray = "0.17.1"
rayon = "1.8"
rustfft = { version = "6.4", features = ["avx", "sse", "neon"] }
lru = "0.12"

[features]
default = []
fftw = []
mkl = []
cuda = []
simd_avx2 = []
