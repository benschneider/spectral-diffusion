seed: 42

data:
  source: synthetic
  family: spectral
  channels: 3
  height: 32
  width: 32
  size: 128
  synthetic:
    size: 128
    image_size: 32
    channels: 3
    freq_mix: 0.5
    color_mix: 0.25
    include_gratings: true
    include_shapes: true
    use_text: true
    log_fft_energy: false
    seed: 42

diffusion:
  beta_schedule: cosine
  num_timesteps: 1000
  prediction_type: eps
  fft_norm: ortho
  snr_ratio: 1.0
  spectral_operator_mode: none

spectral:
  operator_mode: none
  snr_ratio: 1.0

loss:
  reduction: mean

model:
  type: unet_tiny
  channels: 3
  base_channels: 32
  depth: 2

optim:
  lr: 0.0001
  weight_decay: 0.0

training:
  batch_size: 32
  epochs: 1
  num_batches: 200
  log_every: 25

evaluation:
  image_size: null
  reference_dir: null
  use_fid: false

sampling:
  enabled: false
  num_samples: 16
  num_steps: 1000
  sampler_type: ddim
