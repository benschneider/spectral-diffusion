model:
  type: unet_tiny
  channels: 3
  base_channels: 8
  depth: 1

data:
  source: synthetic
  channels: 3
  height: 16
  width: 16

training:
  batch_size: 128
  epochs: 5
  num_batches: 20
  log_every: 5

optim:
  lr: 2.0e-4
  weight_decay: 0.0

diffusion:
  num_timesteps: 100
  beta_schedule: linear
  prediction_type: eps
  loss_threshold: null
  time_embed_dim: 64
  snr_ratio: 1.0
  spectral_operator_mode: none
  fft_norm: ortho

loss:
  reduction: mean

spectral:
  operator_mode: none
  snr_ratio: 1.0

sampling:
  enabled: true
  sampler_type: ddpm
  num_samples: 8
  num_steps: 20

initialization:
  strategy: default
  scale: 0.02
  source:
    type: random_normal
    length: 2048
    mean: 0.0
    std: 2.5

evaluation:
  reference_dir: null
  use_fid: false
  image_size: null
