model:
  type: unet_tiny
  channels: 3
  base_channels: 16
  depth: 1

data:
  source: cifar10
  channels: 3
  height: 32
  width: 32

diffusion:
  num_timesteps: 500
  beta_schedule: cosine
  prediction_type: eps
  time_embed_dim: 64
  fft_norm: ortho
  snr_ratio: 1.0
  spectral_operator_mode: none

training:
  batch_size: 16
  epochs: 1
  train_steps: 5
  log_every: 1

optim:
  lr: 1.0e-4
  weight_decay: 0.0

sampling:
  enabled: true
  sampler_type: ddpm
  num_samples: 16
  sampling_steps: 50
