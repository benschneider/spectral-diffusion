model:
  type: unet_tiny
  channels: 3
  base_channels: 32
  depth: 2

data:
  source: synthetic
  channels: 3
  height: 32
  width: 32
  family: spectral

diffusion:
  num_timesteps: 1000
  beta_schedule: cosine
  prediction_type: eps
  time_embed_dim: 128
  fft_norm: ortho
  snr_ratio: 1.0
  spectral_operator_mode: none

training:
  batch_size: 64
  epochs: 3
  train_steps: 10
  log_every: 2

optim:
  lr: 3.0e-3
  weight_decay: 0.0

sampling:
  enabled: true
  sampler_type: ddpm
  num_samples: 16
  sampling_steps: 50
