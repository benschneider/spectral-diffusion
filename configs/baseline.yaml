model:
  type: unet_tiny
  channels: 3
  base_channels: 32
  depth: 2
data:
  source: cifar10
  root: data
  channels: 3
  height: 32
  width: 32
  download: false
training:
  batch_size: 32
  epochs: 1
  num_batches: null
  log_every: 100
diffusion:
  num_timesteps: 1000
  beta_schedule: cosine
  prediction_type: eps
  loss_threshold: null
  time_embed_dim: 128
  snr_ratio: 1.0
  spectral_operator_mode: none
  fft_norm: ortho
loss:
  reduction: mean
optim:
  lr: 1.0e-4
  weight_decay: 0.0
spectral:
  operator_mode: none
  snr_ratio: 1.0
sampling:
  enabled: false
  sampler_type: ddim
  num_samples: 16
  num_steps: 1000
evaluation:
  reference_dir: null
  use_fid: false
  image_size: null
