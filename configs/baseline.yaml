model:
  type: unet_tiny
  channels: 3
  base_channels: 32
  depth: 2

data:
  source: cifar10
  channels: 3
  height: 32
  width: 32

diffusion:
  num_timesteps: 1000
  beta_schedule: cosine
  prediction_type: eps
  time_embed_dim: 128
  fft_norm: ortho
  snr_ratio: 1.0
  spectral_operator_mode: none

training:
  batch_size: 32
  epochs: 1
  train_steps: null
  log_every: 10

optim:
  lr: 1.0e-4
  weight_decay: 0.0

sampling:
  enabled: true
  sampler_type: ddim
  num_samples: 16
  sampling_steps: 1000
