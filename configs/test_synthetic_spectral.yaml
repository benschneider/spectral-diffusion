seed: 1234

data:
  source: synthetic
  family: spectral
  channels: 3
  height: 32
  width: 32
  size: 64
  synthetic:
    size: 64
    image_size: 32
    channels: 3
    freq_mix: 0.45
    color_mix: 0.3
    include_gratings: true
    include_shapes: true
    use_text: true
    log_fft_energy: false
    seed: 1234

diffusion:
  beta_schedule: cosine
  num_timesteps: 1000
  prediction_type: eps
  snr_transform: snr
  snr_weighting: true
  uniform_corruption: true
  uniform_corruption_scale: 0.15
  adaptive_rescale: true
  similarity_target: 0.7
  fft_norm: ortho
  dc_scale_factor: 0.0
  snr_ratio: 1.0

spectral:
  apply_to:
    - input
    - output
  bandpass_inner: 0.1
  bandpass_outer: 0.6
  enabled: false
  freq_equalized_noise: true
  normalize: true
  per_block: false
  weighting: none
  noise_shaping_strength: off
  loss_weighting: none
  uniform_corruption_scale: 0.15
  adaptive_rescale: true
  similarity_target: 0.7
  fft_norm: ortho
  dc_scale_factor: 0.0
  snr_ratio: 1.0

loss:
  reduction: mean
  bandpass_inner: 0.1
  bandpass_outer: 0.6
  spectral_weighting: none

model:
  type: unet_tiny
  channels: 3
  base_channels: 32
  depth: 2

optim:
  lr: 0.0001
  weight_decay: 0.0

training:
  batch_size: 16
  epochs: 1
  num_batches: 32
  log_every: 5

evaluation:
  image_size: null
  reference_dir: null
  use_fid: false

sampling:
  enabled: false
  num_samples: 8
  num_steps: 250
  sampler_type: ddim
