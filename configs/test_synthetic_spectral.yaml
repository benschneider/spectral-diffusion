# Test configuration for SyntheticSpectralDataset
# This config demonstrates the rich procedural generation capabilities
# Usage: python scripts/debug/record_training_steps.py --config configs/test_synthetic_spectral.yaml --steps 100 --output-dir scratch/synth_test

model:
  type: unet_tiny
  channels: 3
  base_channels: 32
  depth: 2

data:
  source: synthetic
  family: spectral  # Use the new SyntheticSpectralDataset
  channels: 3
  height: 32
  width: 32
  num_workers: 0
  
  # SyntheticSpectralDataset configuration
  synthetic:
    size: 50000
    image_size: 32
    channels: 3
    freq_mix: 0.5        # 0=low-freq emphasis, 1=high-freq emphasis
    color_mix: 0.2       # 0=independent RGB, 1=grayscale correlated
    use_text: true       # Include Lorem Ipsum text snippets
    include_gratings: true   # Include spectral gratings (sinusoids)
    include_shapes: true     # Include geometric shapes
    log_fft_energy: false    # Set to true for FFT diagnostics
    seed: 42

training:
  batch_size: 32
  epochs: 1
  num_batches: 100
  log_every: 10

optim:
  lr: 0.0001
  weight_decay: 0.0

diffusion:
  num_timesteps: 1000
  beta_schedule: cosine
  prediction_type: eps
  snr_weighting: false
  snr_transform: snr
  loss_threshold: null
  time_embed_dim: 128
  uniform_corruption: true
  uniform_corruption_scale: 0.15
  adaptive_rescale: true
  similarity_target: 0.7
  fft_norm: ortho
  dc_scale_factor: 0.1
  snr_ratio: 1.0

loss:
  reduction: mean
  spectral_weighting: none
  bandpass_inner: 0.1
  bandpass_outer: 0.6

spectral:
  enabled: false
  normalize: true
  weighting: none
  freq_equalized_noise: true
  freq_attention: false
  apply_to: [input, output]
  per_block: false
  bandpass_inner: 0.1
  bandpass_outer: 0.6
  noise_shaping_strength: off
  loss_weighting: none

sampling:
  enabled: false
  sampler_type: ddim
  num_samples: 16
  num_steps: 1000

evaluation:
  reference_dir: null
  use_fid: false
  image_size: null