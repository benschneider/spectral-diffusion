factors:
  snr_ratio:
    description: Signal-to-noise target for spectral corruption scaling.
    levels: [0.8, 1.0, 1.4]
  spectral_operator_mode:
    description: Spectral shaping operator applied to noise.
    levels: ["none", "radial", "radial_squared"]
  sampler_type:
    description: Reverse sampler choice.
    levels: ["ddim", "dpm_solver_pp"]
  sampling_steps:
    description: Number of denoising steps during sampling.
    levels: [10, 20, 30]
  train_steps:
    description: Training iterations (num_batches) for Taguchi sweep.
    levels: [50, 100, 200]
  image_resolution:
    description: Input spatial resolution applied via resize.
    levels: [32, 64, 128]
