suites:
  fast_synthetic:
    description: "Quick 32×32 synthetic Taguchi run with best-known defaults."
    include:
      - snr_ratio
      - spectral_operator_mode
      - sampler_type
      - sampling_steps
    fixed:
      train_steps: 50
      image_resolution: 32
    oa: L27
    oa_path: configs/taguchi/L27_extended.csv
    randomize: false
    seeds: [42]
    base_config: configs/taguchi_smoke_best.yaml
