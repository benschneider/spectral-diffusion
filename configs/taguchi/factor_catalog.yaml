factors:
  spectral_adapter_placement:
    kind: enum
    levels: ["none", "input_only", "input_and_output"]
    cost_weight: 1.2
    role: spectral
    doc: "Toggle whether spectral adapters see only input or both input/output in the UNet."
  spectral_loss_weighting:
    kind: enum
    levels: ["none", "radial_highfreq", "aggressive_highfreq"]
    cost_weight: 1.1
    role: loss
    doc: "Differential loss weighting for high-frequency reconstruction."
  spectral_noise_shaping_strength:
    kind: float
    levels: [0.0, 0.5, 1.0]
    cost_weight: 1.2
    role: corruption
    doc: "Level of spectral noise shaping before FFT inversion."
    depends_on:
      spectral_adapter_placement: ["input_only", "input_and_output"]
  snr_ratio:
    kind: float
    levels: [0.8, 1.0, 1.4]
    cost_weight: 1.0
    role: noise
    doc: "Target SNR ratio scaling inside the synthetic pipeline."
  phase_attention_capacity:
    kind: enum
    levels: ["off", "tiny", "full"]
    cost_weight: 1.3
    role: model
    doc: "Phase correction module head count (0 disables PCM)."
    depends_on:
      spectral_adapter_placement:
        - "input_only"
        - "input_and_output"
  sampler_type:
    kind: enum
    levels: ["ddim", "dpm_solver_pp", "spectral_guided"]
    cost_weight: 1.3
    role: sampler
    doc: "Reverse diffusion sampler choice for this taguchi run."
  sampling_steps:
    kind: int
    levels: [30, 50, 100]
    fixed_default: 30
    cost_weight: 2.0
    role: expensive
    doc: "Number of denoising steps executed during sampling."
  train_steps:
    kind: int
    levels: [50, 100, 200]
    fixed_default: 50
    cost_weight: 3.0
    role: expensive
    doc: "Number of training iterations (`training.num_batches`) per diagnostic run."
  image_resolution:
    kind: int
    levels: [32, 64, 128]
    fixed_default: 32
    cost_weight: 1.5
    role: data
    doc: "Spatial resolution applied via data height/width."
  normalization_mode:
    kind: enum
    levels: ["off", "per_batch_std", "per_band_std"]
    cost_weight: 1.0
    role: core
    doc: "Which normalization strategy to use for synthetic batches."
  lambda_var:
    kind: float
    levels: [0.0007, 0.002, 0.004]
    cost_weight: 1.0
    role: core
    doc: "Variance penalty weight λ_var embedded in the synthetic regulator."
  learning_rate:
    kind: float
    levels: [0.0003, 0.001, 0.003]
    cost_weight: 1.0
    role: core
    doc: "Base learning rate fed into the optimizer."
  grad_clipping:
    kind: enum
    levels: ["none", "global_1.0", "per_layer_0.02"]
    cost_weight: 1.0
    role: stability
    doc: "Gradient clipping mode for the diagnostic run."
  synthetic_profile:
    kind: enum
    levels: ["piecewise", "texture", "randomfield"]
    cost_weight: 1.0
    role: data
    doc: "Family of synthetic textures used as inputs."
  noise_color:
    kind: enum
    levels: ["white", "multicolor", "patterned"]
    cost_weight: 1.0
    role: corruption
    doc: "Noise coloration applied during corruption."
  spectral_slope:
    kind: enum
    levels: ["flat", "mild", "steep"]
    cost_weight: 1.0
    role: data
    doc: "Spectral slope α used for random field generation."
  optimizer:
    kind: enum
    levels: ["adamw", "lion", "adafactor"]
    cost_weight: 1.1
    role: optimizer
    doc: "Optimizer family for the diagnostics run."
  ema_beta:
    kind: float
    levels: [0.0, 0.99, 0.999]
    cost_weight: 0.5
    role: optimizer
    doc: "EMA smoothing coefficient for recorded weights."
  shock_handler:
    kind: enum
    levels: ["off", "on"]
    cost_weight: 0.8
    role: stability
    doc: "Enable temporary LR halving when SNR overflow is detected."
  snr_level:
    kind: enum
    levels: ["low", "nominal", "high"]
    cost_weight: 0.7
    role: noise
    doc: "Preset SNR level used when --snr-ratio isn't provided."
  seed_mode:
    kind: enum
    levels: ["42", "123", "314"]
    cost_weight: 0.1
    role: reproducibility
    doc: "Preset random seed for deterministic diagnostics."
  spectral_backend:
    kind: enum
    levels: ["torch_fft", "cpu_pocketfft", "cpu_fftw", "cpu_mkl", "fused_cpu", "fused_cuda"]
    cost_weight: 1.5
    role: backend
    doc: "FFT processing backend selection for spectral operations."
  data_gen_backend:
    kind: enum
    levels: ["python", "rust"]
    cost_weight: 0.8
    role: backend
    doc: "Data generation backend for synthetic datasets."
  precision_mode:
    kind: enum
    levels: ["fp32", "tf32", "bf16"]
    cost_weight: 1.2
    role: precision
    doc: "Numeric precision mode for computations."
  spectral_backend:
    kind: enum
    levels: ["torch_fft", "cpu_fftw", "cpu_pocketfft", "fused_cpu", "fused_cuda"]
    cost_weight: 1.5
    role: performance
    doc: "FFT backend"
    requires: ["cpu_fftw => feature_fftw", "fused_cuda => cuda_available"]
  data_gen_backend:
    kind: enum
    levels: ["python", "rust"]
    cost_weight: 1.2
    role: performance
  precision_mode:
    kind: enum
    levels: ["fp32", "tf32", "bf16"]
    cost_weight: 0.5
    role: numeric
constraints:
  - expr: 'normalization_mode == "off" and lambda_var == 0.004'
    reason: 'Higher λ_var without normalization destabilizes early gradients.'
    severity: block
  - expr: 'image_resolution == 128 and sampling_steps == 100'
    reason: 'High resolution with max steps exceeds the runtime budget.'
    severity: block
  - expr: 'grad_clipping == "none" and learning_rate == 0.003'
    reason: 'High LR without clipping tends to overflow; prefer warn then block.'
    severity: warn
  - rule: "if spectral_backend in ['fused_cuda'] then cuda_available"
    reason: "GPU required"
  - rule: "if precision_mode == 'tf32' then device == 'cuda'"
    reason: "TF32 is CUDA-only"
estimation:
  base_seconds_per_run: 120
  multipliers:
    train_steps:     {"50": 1.0, "100": 2.0, "200": 4.0}
    sampling_steps:  {"30": 1.0, "50": 1.5, "100": 2.8}
    "image_resolution": {"32": 1.0, "64": 2.1, "128": 4.5}
