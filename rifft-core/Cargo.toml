[package]
name = "rifft-core"
version = "0.1.0"
edition = "2021"
authors = ["RIFFT Team <fft@rifft.dev>"]
description = "RIFFT core FFT/DLPack/FFI bridge"
license = "Apache-2.0"
repository = "https://example.com/rifft-core"
readme = "README.md"

[lib]
name = "rifft_core"
crate-type = ["rlib", "cdylib"]

[features]
default = []
simd_avx2 = []
python = ["pyo3"]

[dependencies]
num-complex = "0.4"
rayon = "1.10"
rustfft = "6.4.1"
once_cell = "1.19"
parking_lot = "0.12"
thiserror = "1.0"
libc = "0.2"
log = "0.4"
cfg-if = "1.0"
pyo3 = { version = "0.21", features = ["extension-module", "abi3-py39"], optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
rand = "0.8"

[profile.release]
lto = true
codegen-units = 1
