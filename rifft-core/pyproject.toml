[build-system]
requires = ["maturin>=1.5"]
build-backend = "maturin"

[project]
name = "riff-core"
version = "0.1.0"
description = "RIFFT zero-copy FFT bindings"
readme = "README.md"
authors = [{ name = "RIFFT Team", email = "fft@rifft.dev" }]
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
]

[project.optional-dependencies]
test = ["pytest>=7", "torch>=2.1"]

[tool.maturin]
module-name = "riff_core._internal"
features = ["python"]
python-source = "python"
